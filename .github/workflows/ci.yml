name: Continuous Integration

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - "agent/**"
      - "codex/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Security - Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan complete history
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  backend:
    name: Backend - Python 3.11 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock

      - name: Install locked backend, tests, and audit tooling (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e backend

      - name: Install backend, tests, and audit tooling (Linux portability)
        if: runner.os != 'Windows'
        run: python -m pip install --disable-pip-version-check -e "./backend[dev]" pip-audit

      - name: Validate canonical version
        run: python scripts/version.py check

      - name: Ruff
        run: python -m ruff check backend/app backend/run.py backend/tests scripts tests --config backend/pyproject.toml

      - name: Backend and portability tests
        # Coverage runs as part of the normal test step rather than as a second
        # pass, so the suite is executed once. The floor sits below the current
        # figure: it is a regression guard against whole routes losing their
        # tests, not a target to game.
        run: >-
          python -m pytest backend/tests tests --quiet --tb=short --no-header
          --cov=app --cov-report=term-missing --cov-fail-under=70
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: backend

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Audit locked Python dependencies (Windows)
        if: runner.os == 'Windows'
        run: python -m pip_audit -r backend/requirements.lock

      - name: Audit resolved Python dependencies (Linux)
        if: runner.os != 'Windows'
        run: python -m pip_audit backend

  frontend:
    name: Frontend - Node 22
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Production build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  desktop:
    name: Desktop - Windows Rust/Tauri
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The Python and Node jobs cache their dependencies through their setup
      # actions; this job had none, so every run re-downloaded the crate
      # registry, rebuilt every dependency, and compiled cargo-audit from
      # source before it could audit anything.
      #
      # The key is the lockfile: a dependency change invalidates it, which is
      # exactly when a stale build directory would be wrong. `restore-keys`
      # lets a lockfile bump start from the previous build rather than from
      # nothing, since most crates are unchanged across one.
      #
      # `~/.cargo/bin` is included on purpose — it is where cargo-audit lands,
      # and reinstalling a pinned version on every run is the single most
      # expensive step in this job.
      - name: Cache Rust toolchain artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo check --locked
          cargo check --locked --features updater-release

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked --all-targets

      # Skipped entirely when the cache already holds the pinned build. The
      # version stays pinned so a restored binary and a fresh install are the
      # same tool.
      - name: Install cargo-audit
        shell: bash
        run: |
          if cargo audit --version 2>/dev/null | grep -q "0.22.2"; then
            echo "cargo-audit 0.22.2 restored from cache"
          else
            cargo install cargo-audit --version 0.22.2 --locked
          fi

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit

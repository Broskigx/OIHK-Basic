name: Continuous Integration

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - "agent/**"
      - "codex/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Security - Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan complete history
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  backend:
    name: Backend - Python 3.11 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock

      - name: Install locked backend, tests, and audit tooling (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e backend

      - name: Install backend, tests, and audit tooling (Linux portability)
        if: runner.os != 'Windows'
        run: python -m pip install --disable-pip-version-check -e "./backend[dev]" pip-audit

      - name: Validate canonical version
        run: python scripts/version.py check

      - name: Ruff
        run: python -m ruff check backend/app backend/run.py backend/tests scripts tests --config backend/pyproject.toml

      - name: Backend and portability tests
        # Coverage runs as part of the normal test step rather than as a second
        # pass, so the suite is executed once. The floor sits below the current
        # figure: it is a regression guard against whole routes losing their
        # tests, not a target to game.
        run: >-
          python -m pytest backend/tests tests --quiet --tb=short --no-header
          --cov=app --cov-report=term-missing --cov-fail-under=70
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: backend

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Audit locked Python dependencies (Windows)
        if: runner.os == 'Windows'
        run: python -m pip_audit -r backend/requirements.lock

      - name: Audit resolved Python dependencies (Linux)
        if: runner.os != 'Windows'
        run: python -m pip_audit backend

  frontend:
    name: Frontend - Node 22
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Production build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  system-link-e2e:
    name: System Link E2E - Basic <-> Evidence Lab
    # Windows because that is where this smoke is verified and where the
    # product ships. The script itself is platform-neutral apart from a
    # PowerShell-guarded cleanup path, but "compiles on Linux" is not the same
    # as "passes on Linux", and this job exists to prove the pair actually
    # works rather than to assert it.
    runs-on: windows-2022
    # A cold run builds the Evidence Lab runtime with PyInstaller and its UI
    # with npm before the eighteen lifecycle steps begin. Warm, the whole thing
    # is ~90s; the ceiling is for the cold case plus headroom.
    timeout-minutes: 30
    env:
      # OiHK-evidence-lab is a private repository, so the automatic
      # GITHUB_TOKEN cannot read it — that token is scoped to this repository
      # alone. A PAT with read access to the module repo has to be supplied as
      # a secret. Without it the job reports why and stops, rather than failing
      # and looking like a broken contract when it is a missing credential.
      EVIDENCE_LAB_TOKEN: ${{ secrets.EVIDENCE_LAB_TOKEN }}
      EVIDENCE_LAB_REF: main

    steps:
      - name: Check whether the module repository is reachable
        id: preflight
        run: |
          if ([string]::IsNullOrEmpty($env:EVIDENCE_LAB_TOKEN)) {
            Write-Output "::notice::EVIDENCE_LAB_TOKEN is not set, so the System Link E2E is skipped."
            Write-Output "::notice::Create a fine-grained PAT with Contents:read on Broskigx/OiHK-evidence-lab"
            Write-Output "::notice::and add it as the repository secret EVIDENCE_LAB_TOKEN to enable this job."
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Check out OIHK Basic
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # actions/checkout refuses any path outside the workspace, so the module
      # clone lands inside it. Nothing here collects it by accident: every
      # other job names its paths explicitly (ruff and pytest take path
      # arguments, the frontend job sets working-directory) and this checkout
      # only exists in this job's runner.
      - name: Check out OIHK Evidence Lab
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Broskigx/OiHK-evidence-lab
          ref: ${{ env.EVIDENCE_LAB_REF }}
          token: ${{ env.EVIDENCE_LAB_TOKEN }}
          path: evidence-lab

      - name: Set up Python
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          # The smoke builds its own virtualenv and installs both products into
          # it, so nothing is cached by the venv itself — but pip's download
          # cache is, and PyInstaller plus the two dependency trees are the
          # slow part of a cold run.
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            evidence-lab/pyproject.toml

      - name: Set up Node.js
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: evidence-lab/ui/package-lock.json

      # Run under PowerShell, not bash: Git Bash reports the workspace as
      # /d/a/repo/repo, which Python on Windows cannot resolve, so the module
      # path has to be passed in its native form.
      #
      # The script exits non-zero when any of the eighteen steps fails, which
      # is what makes this job meaningful. Before the relaunch was fixed it
      # returned 0 immediately while still building, and would have reported
      # success here without having run a single step.
      - name: Run the System Link v1 E2E smoke
        if: steps.preflight.outputs.enabled == 'true'
        run: python scripts/smoke_system_link_e2e.py --evidence-lab "$env:GITHUB_WORKSPACE\evidence-lab"

  desktop:
    name: Desktop - Windows Rust/Tauri
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The Python and Node jobs cache their dependencies through their setup
      # actions; this job had none, so every run re-downloaded the crate
      # registry, rebuilt every dependency, and compiled cargo-audit from
      # source before it could audit anything.
      #
      # The key is the lockfile: a dependency change invalidates it, which is
      # exactly when a stale build directory would be wrong. `restore-keys`
      # lets a lockfile bump start from the previous build rather than from
      # nothing, since most crates are unchanged across one.
      #
      # `~/.cargo/bin` is included on purpose — it is where cargo-audit lands,
      # and reinstalling a pinned version on every run is the single most
      # expensive step in this job.
      - name: Cache Rust toolchain artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo check --locked
          cargo check --locked --features updater-release

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked --all-targets

      # Skipped entirely when the cache already holds the pinned build. The
      # version stays pinned so a restored binary and a fresh install are the
      # same tool.
      - name: Install cargo-audit
        shell: bash
        run: |
          if cargo audit --version 2>/dev/null | grep -q "0.22.2"; then
            echo "cargo-audit 0.22.2 restored from cache"
          else
            cargo install cargo-audit --version 0.22.2 --locked
          fi

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit

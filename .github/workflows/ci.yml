name: CI

on:
  push:
    branches: ["master", "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2

  quality:
    name: Tests, lint, build, and audits
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -e "./backend[dev]" pip-audit
      - name: Validate canonical version
        run: python scripts/version.py check
      - name: Python lint
        run: python -m ruff check backend/app backend/run.py scripts tests
      - name: Python tests
        run: python -m pytest -q
      - name: Python dependency audit
        run: python -m pip_audit backend

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --run
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt -- --check
      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo check --locked
          cargo check --locked --features updater-release
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Rust dependency audit
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

name: Windows Package

on:
  workflow_dispatch:
  push:
    tags:
      - "basic-v*"

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Build Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build and validate installer
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Upload installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: oihk-basic-windows-x64-${{ github.sha }}
          path: |
            dist/windows/*.exe
            dist/windows/*.sha256
          if-no-files-found: error
          retention-days: 14

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oihk-basic-backend"
version = "0.1.1-alpha.2"
description = "OIHK Basic — Local-first investigation and OSINT platform"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.19.0",
  "alembic>=1.13.0",
  "cryptography>=41.0.0",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "keyring>=25.6.0",
  "orjson>=3.10.0",
  "pillow>=10.2.0",
  "pydantic-settings>=2.2.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.29",
  "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.15.0",
]
release = [
  "pip-audit==2.10.1",
  "pyinstaller==6.21.0",
  "wheel==0.47.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501", "SIM117"]
